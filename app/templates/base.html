<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
{% block title %}
AI IDS
{% endblock %}
</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="icon"
      type="image/jpeg"
      href="{{ url_for('static', filename='images/logo.jpeg') }}">

<style>

/* ==========================
   Global
========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:#121212;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    padding-top:90px;

}

/* ==========================
   Navbar
========================== */

.navbar{

    position:fixed;
    top:0;
    left:0;
    width:100%;

    background:#212702;

    z-index:999;

    padding:15px 0;

    box-shadow:0 5px 20px rgba(0,0,0,.5);

}

.nav-container{

    width:92%;
    margin:auto;

    display:flex;
    justify-content:space-between;
    align-items:center;

}

.logo{
    color:#eae2e2;
    text-decoration:none;
    font-size:28px;
    font-weight:bold;

    display:flex;
    align-items:center;
}

.logo:hover{
    color:#072ce7;
}

.logo-img{
    height:65px;
    width:65px;
    border-radius:20%;
    object-fit:cover;
    margin-right:10px;
}

.nav-links{

    display:flex;
    gap:12px;

}

.nav-links a{

    color:white;

    background:#12a3c7;
    text-decoration:none;

    padding:6px 10px;

    border-radius:10px;

    transition:.3s;

    font-size:15px;

}

.nav-links a:hover{

    background:#04ef3f;

    color:rgb(0, 1, 8);

    transform:translateY(-1px);

}

/* Logout */

.logout{

    background:#f8f4f7;

}

.logout:hover{

    background:#d3182b !important;

}

/* ==========================
   Container
========================== */

.container{

    padding-bottom:50px;

}

/* ==========================
   Cards
========================== */

.card{

    border:none;

    border-radius:15px;

    transition:.35s;

}

.card:hover{

    transform:translateY(-8px);

    box-shadow:0 15px 30px rgba(0,0,0,.4);

}

/* ==========================
   Chart Card
========================== */

.chart-card{

    background:#1f1f1f;

    padding:20px;

    border-radius:15px;

}

canvas{

    background:white;

    border-radius:10px;

    padding:10px;

}

/* ==========================
   Tables
========================== */

.table{

    border-radius:10px;

    overflow:hidden;

}

/* ==========================
   Buttons
========================== */

.btn{

    border-radius:10px;

}

/* ==========================
   Footer
========================== */

footer{

    margin-top:60px;

    padding:25px;

    text-align:center;

    background:#241611;

    color:#fffbfd;

}

footer hr{

    border-color:#444;

}

/* ==========================
   Responsive
========================== */

@media(max-width:768px){

    .nav-container{
        flex-direction:column;
    }

    .nav-links{
        margin-top:15px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .logo{
        margin-bottom:10px;
    }
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar">

<div class="nav-container">

<a href="{{ url_for('home') }}" class="logo">
    <img src="{{ url_for('static', filename='images/logo.jpeg') }}"
         alt="AI IDS Logo"
         class="logo-img">
    <span class="ms-2">AI IDS</span>
</a>

<div class="nav-links">

<a href="{{ url_for('home') }}">
<i class="bi bi-house"></i> Home
</a>

<a href="{{ url_for('dashboard') }}">
<i class="bi bi-speedometer2"></i> Dashboard
</a>

<a href="{{ url_for('upload') }}">
<i class="bi bi-upload"></i> Upload
</a>

<a href="{{ url_for('history') }}">
<i class="bi bi-clock-history"></i> History
</a>

<a href="{{ url_for('about') }}">
<i class="bi bi-info-circle"></i> About
</a>

<a href="{{ url_for('logout') }}" class="logout">
<i class="bi bi-box-arrow-right"></i> Logout
</a>

</div>

</div>

</nav>

<!-- Main Content -->

<div class="container">

{% block content %}
{% endblock %}

</div>

<!-- Footer -->

<footer>

<hr>

<h5>
🛡 AI IDS
</h5>

<p>
Machine Learning Based Network Security Monitoring
</p>

<p>
Intern Project
</p>

<p>
© 2026 All Rights Reserved
</p>

</footer>

</body>

</html>
